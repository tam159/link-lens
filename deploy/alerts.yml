# Prometheus alert rules for the product service, from the metrics at /metrics.
# Thresholds are starting points for the owner to set against real traffic.
# Not loaded into a Prometheus yet: check with `promtool check rules` first.
groups:
  - name: link-lens-product
    rules:
      - alert: LinkLensErrorRate
        # Server errors as a share of all answers, per interface.
        expr: >
          sum by (interface) (rate(linklens_requests_total{status=~"5.."}[5m]))
          / sum by (interface) (rate(linklens_requests_total[5m])) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "More than 2% of {{ $labels.interface }} answers are server errors"
      - alert: LinkLensSlowAnswers
        # The 95th percentile of time to answer, per interface.
        expr: >
          histogram_quantile(0.95,
            sum by (interface, le) (rate(linklens_request_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "95% of {{ $labels.interface }} answers take more than a second"
      - alert: LinkLensNoTraffic
        expr: sum(rate(linklens_requests_total[15m])) == 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "The product service has answered nothing for 30 minutes"
