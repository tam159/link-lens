classes:
  Entity:
    description: A legal entity or other subject a source makes claims about.
    attributes:
      legal_name:
        description: As registered. Not the trading name.
        range: string
        annotations:
          concept: entity.legal_name
      trading_name:
        description: May be multiple. Emit one observation each.
        range: string
        annotations:
          concept: entity.trading_name
        multivalued: true
      abn:
        description: Australian Business Number. Has a checksum — validate it, do not just length-check.
        range: string
        annotations:
          concept: entity.abn
      acn:
        description: Australian Company Number. Also checksummed. The last 9 digits of an ABN are often
          the ACN, but not always.
        range: string
        annotations:
          concept: entity.acn
      nzbn:
        description: New Zealand Business Number, if you happen to hit an NZ source.
        range: string
        annotations:
          concept: entity.nzbn
      entity_type:
        description: Default to unknown. Guessing here causes downstream harm.
        range: EntityEntityTypeValue
        annotations:
          concept: entity.entity_type
      status:
        description: Canonical entity.status source claim.
        range: EntityStatusValue
        annotations:
          concept: entity.status
      website:
        description: Canonical entity.website source claim.
        range: string
        annotations:
          concept: entity.website
      industry_code:
        description: ANZSIC where available. Record the raw source value too.
        range: string
        annotations:
          concept: entity.industry_code
      date_registered:
        description: Canonical entity.date_registered source claim.
        range: date
        annotations:
          concept: entity.date_registered
      date_established:
        description: Date the charity organisation was established, distinct from any regulator registration
          date; parse as a date.
        range: date
        annotations:
          concept: entity.date_established
      charity_size:
        description: Charity size category reported from the latest Annual Information Statement; trim
          and accept the documented size labels.
        range: EntityCharitySizeValue
        annotations:
          concept: entity.charity_size
      responsible_person_count:
        description: Reported number of charity board or committee members; parse as a non-negative integer.
        range: integer
        annotations:
          concept: entity.responsible_person_count
        minimum_value: 0
      operating_region:
        description: Australian state or territory in which the charity reports operating; emit one category
          for each affirmative indicator.
        range: EntityOperatingRegionValue
        annotations:
          concept: entity.operating_region
        multivalued: true
      operating_country:
        description: ISO 3166-1 alpha-3 country code reported for an overseas charity operating location;
          trim and emit each comma-separated code separately.
        range: string
        annotations:
          concept: entity.operating_country
        multivalued: true
      charity_subtype:
        description: ACNC charity subtype categories reported for a charity, including charitable-purpose
          categories, PBI and HPC; emit each affirmative indicator as a category.
        range: EntityCharitySubtypeValue
        annotations:
          concept: entity.charity_subtype
        multivalued: true
      charity_beneficiary_category:
        description: Beneficiary groups the charity reports assisting; emit each affirmative indicator
          as a category without treating blanks as negative claims.
        range: EntityCharityBeneficiaryCategoryValue
        annotations:
          concept: entity.charity_beneficiary_category
        multivalued: true
      asic_company_type:
        description: ASIC Company Dataset type code for a company or registered body; trim surrounding
          whitespace and accept documented codes.
        range: EntityAsicCompanyTypeValue
        annotations:
          concept: entity.asic_company_type
      asic_company_class:
        description: ASIC Company Dataset liability class code; trim surrounding whitespace and accept
          documented codes.
        range: EntityAsicCompanyClassValue
        annotations:
          concept: entity.asic_company_class
      asic_company_sub_class:
        description: ASIC Company Dataset subclass code; trim surrounding whitespace and accept documented
          codes.
        range: EntityAsicCompanySubClassValue
        annotations:
          concept: entity.asic_company_sub_class
      asic_register_status:
        description: Status code reported for a company in the ASIC Company Dataset; trim and preserve
          the source code without translating to a broader status.
        range: EntityAsicRegisterStatusValue
        annotations:
          concept: entity.asic_register_status
  Address:
    description: An address as one source record states it; its fields stay together.
    attributes:
      full:
        description: Canonical address.full source claim.
        range: string
        annotations:
          concept: address.full
      locality:
        description: Canonical address.locality source claim.
        range: string
        annotations:
          concept: address.locality
      state:
        description: Canonical address.state source claim.
        range: AddressStateValue
        annotations:
          concept: address.state
      postcode:
        description: Canonical address.postcode source claim.
        range: string
        annotations:
          concept: address.postcode
      country:
        description: Canonical address.country source claim.
        range: string
        annotations:
          concept: address.country
      type:
        description: Address category supplied for the charity address; trim surrounding whitespace and
          retain documented source labels.
        range: AddressTypeValue
        annotations:
          concept: address.type
      line_1:
        description: First separately supplied address-line component of the charity business address;
          trim surrounding whitespace.
        range: string
        annotations:
          concept: address.line_1
      line_2:
        description: Second separately supplied address-line component of the charity business address;
          trim surrounding whitespace.
        range: string
        annotations:
          concept: address.line_2
      line_3:
        description: Third separately supplied address-line component of the charity business address;
          trim surrounding whitespace.
        range: string
        annotations:
          concept: address.line_3
  Registration:
    description: A registration a source records for a subject.
    attributes:
      acnc_date_registered:
        description: Effective date on which the charity was registered with the Australian Charities
          and Not-for-profits Commission; parse as a date and keep distinct from company registration.
        range: date
        annotations:
          concept: registration.acnc_date_registered
      registered_business_name:
        description: Business name shown on an ASIC Business Names register entry; trim surrounding whitespace
          and do not infer a legal-entity owner.
        range: string
        annotations:
          concept: registration.registered_business_name
      business_name_status:
        description: Status label of the ASIC business-name registration; trim and retain source labels
          without mapping them to legal-entity status.
        range: RegistrationBusinessNameStatusValue
        annotations:
          concept: registration.business_name_status
      business_name_registration_date:
        description: Date on which the business name started, parsed from the documented day/month/year
          format; not a company registration date.
        range: date
        annotations:
          concept: registration.business_name_registration_date
      business_name_cancellation_date:
        description: Date on which the business name ceased, parsed from the documented day/month/year
          format when supplied; not an entity deregistration date.
        range: date
        annotations:
          concept: registration.business_name_cancellation_date
      former_state_number:
        description: Identifier allocated to a business name by a previous state or territory regulator
          before 28 May 2012; retain the source string.
        range: string
        annotations:
          concept: registration.former_state_number
      previous_state_of_registration:
        description: Abbreviated state or territory in which the business name was registered by a previous
          regulator; trim and accept documented abbreviations.
        range: RegistrationPreviousStateOfRegistrationValue
        annotations:
          concept: registration.previous_state_of_registration
      business_name_abn:
        description: ABN claim displayed on an ASIC business-name register entry; preserve as an entry-level
          identifier and do not infer legal-entity ownership.
        range: string
        annotations:
          concept: registration.business_name_abn
      original_state:
        description: State in which the company was originally registered, as reported by the ASIC Company
          Dataset; trim and retain the source abbreviation.
        range: string
        annotations:
          concept: registration.original_state
      state_registration_number:
        description: Number assigned when the company was originally registered by a state; preserve as
          a string because formats vary by state.
        range: string
        annotations:
          concept: registration.state_registration_number
      company_deregistration_date:
        description: Date on which the company was deregistered, as reported by the ASIC Company Dataset;
          parse as a date and keep distinct from other registration regimes.
        range: date
        annotations:
          concept: registration.company_deregistration_date
      current_name_start_date:
        description: Start date reported for the current registered company name; parse as a date and
          keep distinct from company registration date.
        range: date
        annotations:
          concept: registration.current_name_start_date
  FinancialPeriod:
    description: Figures a source reports for one reporting period.
    attributes:
      year_end:
        description: Charity's reported financial-year end as a month-and-day label, such as 30-Jun; trim
          surrounding whitespace.
        range: string
        annotations:
          concept: financial_period.year_end
      reporting_period:
        description: Income-year label associated with reported corporate tax information, retained as
          supplied (for example, 2023-24); trim surrounding whitespace.
        range: string
        annotations:
          concept: financial_period.reporting_period
  Licence:
    description: A licence or authorisation a source records for a subject.
    attributes:
      number:
        description: Identifier allocated to an Australian Financial Services licensee; retain the identifier
          as a string, including any leading zeros.
        range: string
        annotations:
          concept: licence.number
      register_entry_name:
        description: Name displayed for a licensee entry on the Australian Financial Services Licensee
          Register; may be an organisation name or an individual's displayed name.
        range: string
        annotations:
          concept: licence.register_entry_name
      start_date:
        description: Start or issue date of an Australian Financial Services licence, distinct from a
          licensee's company registration date; parse as a date.
        range: date
        annotations:
          concept: licence.start_date
      pre_fsr_reference:
        description: Prior register identifier and licence number recorded for a licensee where a register
          was superseded by Financial Services Reform; retain each reference as supplied.
        range: string
        annotations:
          concept: licence.pre_fsr_reference
        multivalued: true
      authorisation_condition:
        description: Current condition stating financial services or products authorised under the licence;
          retain each source condition or row as a separate observation.
        range: string
        annotations:
          concept: licence.authorisation_condition
        multivalued: true
  ServiceLocation:
    description: A place where a subject delivers a service.
    attributes:
      code:
        description: Source identifier for an employment-services provider site or service location; trim
          and preserve as a string.
        range: string
        annotations:
          concept: service_location.code
      contract_name:
        description: Contract name recorded in an employment-services location record; trim without asserting
          the provider's legal relationship to the contract.
        range: string
        annotations:
          concept: service_location.contract_name
      name:
        description: Name used by the source for an employment-services service location; trim surrounding
          whitespace.
        range: string
        annotations:
          concept: service_location.name
      address_line:
        description: Street or premises address line recorded for a service location; trim without inferring
          omitted address components.
        range: string
        annotations:
          concept: service_location.address_line
      website:
        description: Website URL explicitly recorded for a service location; retain as a location-scoped
          source claim, not an entity-wide website.
        range: string
        annotations:
          concept: service_location.website
      latitude:
        description: Latitude coordinate of the service location, parsed as a decimal and limited to the
          valid latitude range.
        range: decimal
        annotations:
          concept: service_location.latitude
        minimum_value: -90
        maximum_value: 90
      longitude:
        description: Longitude coordinate of the service location, parsed as a decimal and limited to
          the valid longitude range.
        range: decimal
        annotations:
          concept: service_location.longitude
        minimum_value: -180
        maximum_value: 180
      agent_freecall_phone:
        description: Telephone number identified as an agent free-call number in the service-location
          source; trim and retain as a string to preserve dialing characters and zeros.
        range: string
        annotations:
          concept: service_location.agent_freecall_phone
  Contact:
    description: A contact point a source lists for a record.
    attributes:
      phone:
        description: Telephone number explicitly identified as a contact phone for a service site; trim
          and retain as a string without treating it as a legal-entity contact.
        range: string
        annotations:
          concept: contact.phone
      email:
        description: Email address recorded for a service-site contact; trim without treating it as a
          legal-entity contact.
        range: string
        annotations:
          concept: contact.email
  Observation:
    description: 'One source claim: a concept and the value the source states.'
    attributes:
      concept:
        description: The concept the claim is about.
        range: ConceptName
        required: true
      value:
        description: The value after the mapping's declared transformations.
        range: string
