# Instance configuration of the Dagster services. The image's entrypoint copies
# it to $DAGSTER_HOME/dagster.yaml at every start. Dagster's run, event and schedule storage is the
# `dagster` database: the same PostgreSQL server as the application, a database
# and a login of its own, and never a schema of the application's database.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      port:
        env: DAGSTER_POSTGRES_PORT
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB

telemetry:
  enabled: false

# No first-run dialog asking for an email address.
nux:
  enabled: false

# How many steps may run at once across all runs, per pool: two by default,
# which covers `downloads` and `database`. Model calls go one at a time; a limit
# for a named pool is kept in Dagster's own storage, so the webserver sets
# `model_calls` to 1 when it starts (see compose.yaml). The application's
# budget is the authority on spend; the queue keeps a burst from racing it.
concurrency:
  pools:
    default_limit: 2
    granularity: op

# How long Dagster keeps the record of each schedule and sensor evaluation.
# Runs are pruned by the prune_run_history job, 90 days by default. This is
# Dagster's own history; the application's records are not in this database.
retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days:
      skipped: 7
      failure: 30
      success: 30
