[project]
name = "link-lens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-sdk>=0.4.4",
    "mcp>=2.3,<3",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg[binary]>=3",
    "pydantic-settings>=2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
]
ontology = [
    "linkml>=1.12.1",
    "pyshacl>=0.40.2",
]
orchestration = [
    "dagster>=1.13.30,<1.14",
    "dagster-dbt>=0.29.30,<0.30",
    "dagster-postgres>=0.29.30,<0.30",
    "dagster-webserver>=1.13.30,<1.14",
]
s3 = [
    "boto3>=1.44.3",
]
transform = [
    "dbt-core>=1.12.7,<1.13",
    "dbt-postgres>=1.11,<1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
link-lens = "link_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/link_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running local services", "live: uses model API and costs money"]
