name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: linklens
          POSTGRES_USER: linklens
          POSTGRES_PASSWORD: linklens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linklens -d linklens"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway CI database; the tests create and drop their own databases on it.
      LINK_LENS_DATABASE_URL: postgresql+psycopg://linklens:linklens@localhost:5432/linklens
      LINK_LENS_TEST_DATABASE_URL: postgresql+psycopg://linklens:linklens@localhost:5432/linklens
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --group ontology

      - name: Lint
        run: uv run ruff check src/link_lens tests scripts/mcp_agent_eval.py --exclude _vendor --select F

      - name: Migrate an empty database up, down and up again
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Lint the generated ontology schema
        run: uv run linkml-lint firmable_ontology.linkml.yaml

      # docs/api holds the REST and MCP contracts clients build against; a change
      # to either must be made on purpose and committed with the code.
      - name: Check the published REST and MCP contracts
        run: uv run pytest -q tests/test_production.py -k published

      - name: Check the kept OKF bundle against the renderer
        run: uv run pytest -q tests/test_fixture_bundle.py

      - name: Test
        run: uv run pytest -q

  # Dagster is installed only here. dbt is in the job above as well, since the
  # tests build the serving views with it.
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: linklens
          POSTGRES_USER: linklens
          POSTGRES_PASSWORD: linklens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linklens -d linklens"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway CI database, migrated below; the tests create their own beside it.
      LINK_LENS_DATABASE_URL: postgresql+psycopg://linklens:linklens@localhost:5432/linklens
      LINK_LENS_TEST_DATABASE_URL: postgresql+psycopg://linklens:linklens@localhost:5432/linklens
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: The runtime image installs neither Dagster nor dbt
        run: |
          if uv export --frozen --no-dev --no-hashes --no-emit-project | grep -iE '^(dagster|dbt)'; then
            echo "Dagster or dbt reached the runtime dependencies" && exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen --group orchestration --group transform

      - name: Lint
        run: uv run ruff check orchestration tests/test_orchestration.py tests/test_transform.py --select F

      - name: Migrate the database
        run: uv run alembic upgrade head

      - name: dbt connects, builds and tests every model, documents them and compares a candidate
        run: |
          uv run link-lens dbt debug
          uv run link-lens dbt build
          uv run link-lens dbt docs generate
          uv run link-lens serving-compare --build

      - name: Dagster definitions load
        run: uv run dagster definitions validate --workspace orchestration/workspace.yaml

      - name: Test dbt, Dagster and the roles on a migrated database
        run: uv run pytest -q tests/test_transform.py tests/test_orchestration.py tests/test_migrations.py

      # The deployment runs this image with nothing of the checkout mounted, so
      # it must hold the code location and the dbt project and load them.
      - name: The Dagster image builds and loads its definitions by itself
        run: |
          docker build -t link-lens-dagster:ci -f deploy/Dockerfile.dagster .
          docker run --rm --entrypoint sh link-lens-dagster:ci -c \
            'unset DAGSTER_HOME; dagster definitions validate --workspace /app/orchestration/workspace.yaml'
