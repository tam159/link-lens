# The Link Lens dbt project: derived SQL only.
#
# dbt builds relations in `analytics` now and takes over the `serving` views in
# phase D1 of docs/ORCHESTRATION_PLAN.md. Every table that holds state belongs
# to Alembic; dbt and Alembic never manage the same relation.
name: link_lens
version: "0.1.0"
config-version: 2
profile: link_lens

# dagster-dbt 0.29 supports dbt-core below 1.13. Moving to dbt version 2 is a
# separate decision; see the risk table of the plan.
require-dbt-version: [">=1.12.0", "<1.13.0"]

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

models:
  link_lens:
    serving:
      # What clients read through the product service. A column or type that
      # differs from the model's contract fails the build instead of reaching them.
      +materialized: view
      # Built in `serving`, where clients read them. To try a changed model
      # first, `link-lens serving-compare --build` builds these models, and only
      # these, into `serving_next` and compares them with the live views. Do not
      # build the whole project with another serving_schema: the reporting
      # models would then read the candidate. The default is given here because
      # this file cannot read a `vars:` block of its own.
      +schema: "{{ var('serving_schema', 'serving') }}"
      +contract:
        enforced: true
      # Relations dbt owns get no default privileges from the migrator: the
      # product service reads them, and so do the OKF tree and the bundle builder.
      +grants:
        select: ["linklens_product", "linklens_pipeline"]
    staging:
      # One thin view per core table that the analytics models read: columns
      # renamed and cast, nothing joined or filtered. They live in `analytics`
      # under the prefix stg_ and are not granted to anyone but dbt.
      +materialized: view
      +schema: analytics
    analytics:
      # Internal reporting, never served to clients. Views, so a number is
      # current whenever it is read; the dashboards read these and nothing else.
      +materialized: view
      +schema: analytics
      # The team and the dashboards read these as linklens_analyst; the console
      # and the CLI, which work as linklens_pipeline, read them too.
      +grants:
        select: ["linklens_analyst", "linklens_pipeline"]
